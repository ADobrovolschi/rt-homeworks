<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text{font:14px Arial,sans-serif;fill:#172033}.title{font-size:20px;font-weight:bold}
      .actor{fill:#f8fafc;stroke:#475569;stroke-width:2}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}
      .msg{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .panel{stroke:#2563eb;stroke-width:1.5;fill:#eff6ff}.panel2{stroke:#65a30d;stroke-width:1.5;fill:#f7fee7}
      .label{font-size:13px}
    </style>
  </defs>
  <text class="title" x="560" y="32" text-anchor="middle">Diagrama de secvență — Tema 01</text>
  <rect class="panel" x="25" y="62" width="1070" height="325" rx="10"/>
  <text class="title" x="45" y="92">1. Telemetrie peste prag → alarmă</text>
  <rect class="panel2" x="25" y="400" width="1070" height="295" rx="10"/>
  <text class="title" x="45" y="430">2. Comandă SET_INTERVAL → confirmare</text>
  <g>
    <rect class="actor" x="40" y="112" width="140" height="42" rx="6"/><text x="110" y="138" text-anchor="middle">Periodic task</text>
    <rect class="actor" x="230" y="112" width="140" height="42" rx="6"/><text x="300" y="138" text-anchor="middle">Alarm queue</text>
    <rect class="actor" x="420" y="112" width="140" height="42" rx="6"/><text x="490" y="138" text-anchor="middle">Sporadic task</text>
    <rect class="actor" x="610" y="112" width="140" height="42" rx="6"/><text x="680" y="138" text-anchor="middle">MQTT broker</text>
    <rect class="actor" x="800" y="112" width="180" height="42" rx="6"/><text x="890" y="138" text-anchor="middle">MessageProcessor</text>
    <path class="life" d="M110 154 V374"/><path class="life" d="M300 154 V374"/>
    <path class="life" d="M490 154 V374"/><path class="life" d="M680 154 V374"/><path class="life" d="M890 154 V374"/>
    <path class="msg" d="M110 180 H680"/><text class="label" x="365" y="174" text-anchor="middle">publish telemetry</text>
    <path class="msg" d="M680 210 H890"/><text class="label" x="785" y="204" text-anchor="middle">telemetry payload</text>
    <path class="msg" d="M110 240 H300"/><text class="label" x="205" y="234" text-anchor="middle">enqueue (temp, prag)</text>
    <path class="msg" d="M300 270 H490"/><text class="label" x="395" y="264" text-anchor="middle">take event</text>
    <path class="msg" d="M490 300 H680"/><text class="label" x="585" y="294" text-anchor="middle">publish alarm</text>
    <path class="msg" d="M680 330 H890"/><text class="label" x="785" y="324" text-anchor="middle">alarm payload</text>
  </g>
  <g>
    <rect class="actor" x="40" y="440" width="150" height="42" rx="6"/><text x="115" y="466" text-anchor="middle">Operator console</text>
    <rect class="actor" x="275" y="440" width="150" height="42" rx="6"/><text x="350" y="466" text-anchor="middle">MQTT broker</text>
    <rect class="actor" x="510" y="440" width="150" height="42" rx="6"/><text x="585" y="466" text-anchor="middle">Aperiodic task</text>
    <rect class="actor" x="745" y="440" width="190" height="42" rx="6"/><text x="840" y="466" text-anchor="middle">MessageProcessor</text>
    <path class="life" d="M115 482 V680"/><path class="life" d="M350 482 V680"/>
    <path class="life" d="M585 482 V680"/><path class="life" d="M840 482 V680"/>
    <path class="msg" d="M115 510 H350"/><text class="label" x="232" y="504" text-anchor="middle">SET_INTERVAL 1000</text>
    <path class="msg" d="M350 550 H585"/><text class="label" x="467" y="544" text-anchor="middle">comandă în coadă</text>
    <path class="msg" d="M585 590 H350"/><text class="label" x="467" y="584" text-anchor="middle">status OK ... 1000</text>
    <path class="msg" d="M350 630 H840"/><text class="label" x="595" y="624" text-anchor="middle">confirmare status</text>
    <text class="label" x="585" y="672" text-anchor="middle">validare, schimbare perioadă, salvare CSV și afișare</text>
  </g>
</svg>
